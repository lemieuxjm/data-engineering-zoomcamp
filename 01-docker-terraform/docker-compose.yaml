services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "ny_taxi"
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

  ingestscript:
    image: green_ingest:v003
    command:
      - --pg-user=root
      - --pg-pass=root
      - --pg-host=localhost  
      - --pg-db=ny_taxi
      - --pg-port=5432
      - --target-table-name=green_taxi_data

volumes:
  ny_taxi_postgres_data:
  pgadmin_data: